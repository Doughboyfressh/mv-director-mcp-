[project]
name = "mv-director-mcp"
version = "0.1.0"
description = "MCP server that turns Claude into a musical director / finishing editor for music videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "numpy>=1.24", "scipy>=1.10", "uvicorn>=0.23", "starlette>=0.27"]

[project.scripts]
mv-director = "mv_director.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mv_director"]
